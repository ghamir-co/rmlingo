kind = "web"
previewPath = "/"
title = "Diplomatic International"
description = "A prestigious marketing website for Diplomatic International, a US-based language interpretation and translation firm serving diplomatic missions, UN agencies, and global corporate entities. Features an editorial, minimalist design with typographic hero, services overview, and client trust section."
version = "1.0.0"
id = "artifacts/diplomatic-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21565

[services.development]
run = "pnpm --filter @workspace/diplomatic-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diplomatic-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/diplomatic-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21565"
BASE_PATH = "/"
