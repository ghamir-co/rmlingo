kind = "web"
previewPath = "/"
title = "RMLingo"
description = "A prestigious marketing website for RMLingo, a Middle East language interpretation and translation company serving diplomatic missions, regional institutions, UN agencies, and global organizations. Features an editorial, minimalist design with a MENA-inspired emerald, sand, and gold palette, Arabic-capable typography, and RTL support."
version = "1.0.0"
id = "artifacts/diplomatic-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21565

[services.development]
run = "pnpm --filter @workspace/diplomatic-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diplomatic-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/diplomatic-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21565"
BASE_PATH = "/"
